name: AEGIS RH Restricted Weil Resolvent bde4 Replay

on:
  push:
    branches:
      - 'evidence/rh-restricted-weil-resolvent-bde4-v1'
    paths:
      - '.github/workflows/rh-restricted-weil-resolvent-bde4.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-restricted-weil-resolvent-bde4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: bde49c7df2b71a64e6e3e909e74045dddf77d985
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  TARGET_MODULE: RestrictedWeilCriterionResolventAnalyticV13
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  verify:
    name: exact restricted-Weil resolvent replay
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact FormalConjectures environment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify pins and install Lean
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          mkdir -p evidence
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Checkout exact AEGIS candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact provider overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))
          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          reps=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for a,b in reps:
            assert text.count(a)==1
            text=text.replace(a,b)
          fp.write_text(text)
          PY
          rm -f .li-provider/lake-manifest.json
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake update mathlib
            lake exe cache get
            lake build \
              Hadamard.OrderOne.LogDerivMultiplicity \
              Lc.LiCriterion.XiGrowth \
              Lc.LiCriterion.HadamardSummabilityBridge \
              Lc.LiCriterion.HadamardBridge
          )
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard \
            .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. \
            .lake/build/lib/lean/FunctionsOfOneComplexVariable/

      - name: Compute exact AEGIS local closure
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p .lake/build/lib/lean evidence
          python3 - "$ROOT" "$TARGET_MODULE" evidence/modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); target=sys.argv[2]; out=pathlib.Path(sys.argv[3])
          mods={p.stem:p for p in root.glob("*.lean")}
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding='utf-8').splitlines():
                  s=line.strip()
                  if not s.startswith('import '): continue
                  for tok in s[len('import '):].split():
                      leaf=tok.split('.')[-1]
                      if leaf in mods: ds.append(leaf)
              deps[m]=ds
          if target not in mods: raise SystemExit('missing:'+target)
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen:return
              if m in active:raise SystemExit('cycle:'+m)
              active.add(m)
              for d in deps[m]:visit(d)
              active.remove(m);seen.add(m);order.append(m)
          visit(target)
          out.write_text('\n'.join(order)+'\n')
          print('LOCAL_CLOSURE_COUNT',len(order))
          for m in order:
              (pathlib.Path(m+'.lean')).write_bytes(mods[m].read_bytes())
              print(m)
          PY
          : > evidence/source-sha256.log
          while IFS= read -r m; do sha256sum "$m.lean" >> evidence/source-sha256.log; done < evidence/modules.txt

      - name: Compile exact restricted-Weil closure
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt

      - name: Audit topology and resolvent analyticity
        shell: bash
        run: |
          set -euo pipefail
          cat > RestrictedWeilResolventAudit.lean <<'LEAN'
          import RestrictedWeilCriterionResolventAnalyticV13
          #print axioms AEGIS.RestrictedWeilCriterionTopologyV13.right_half_minus_centered_zeros_preconnected_v13
          #print axioms AEGIS.RestrictedWeilCriterionResolventAnalyticV13.zero_cauchy_transform_analyticAt_v13
          #print axioms AEGIS.RestrictedWeilCriterionResolventAnalyticV13.zero_cauchy_transform_analyticOnNhd_v13
          LEAN
          lake env lean RestrictedWeilResolventAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit disposition
        if: always()
        shell: bash
        run: |
          count="$(wc -l < evidence/modules.txt 2>/dev/null || true)"
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          TARGET=$TARGET_MODULE
          MODULE_COUNT=$count
          PUNCTURED_HALF_PLANE_TOPOLOGY=TARGETED
          ZERO_CAUCHY_TRANSFORM_ANALYTICITY=TARGETED
          FINAL_IDENTITY_THEOREM_POLE_CONTRADICTION=OPEN
          RIEMANN_HYPOTHESIS=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-restricted-weil-resolvent-bde4
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
