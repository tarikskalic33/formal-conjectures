name: AEGIS DeepMind RH Target Direct V1

on:
  push:
    branches:
      - 'evidence/deepmind-rh-target-direct-v1'
  pull_request:
    paths:
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
      - 'AegisRH/DeepMindRHTargetAuditV1.lean'
      - '.github/workflows/aegis-deepmind-rh-target-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-target:
    name: compile exact DeepMind RiemannHypothesis target
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Bind exact target blob
        shell: bash
        run: |
          set -euo pipefail
          test -f FormalConjectures/Millennium/RiemannHypothesis.lean
          sha256sum FormalConjectures/Millennium/RiemannHypothesis.lean | tee /tmp/rh-target.sha256

      - name: Install project toolchain and cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version

      - name: Compile exact DeepMind target source
        shell: bash
        run: |
          set -euo pipefail
          lake env lean FormalConjectures/Millennium/RiemannHypothesis.lean

      - name: Audit exact target theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AegisRH/DeepMindRHTargetAuditV1.lean 2>&1 | tee /tmp/deepmind-rh-target-axioms.log
          grep -F "RiemannHypothesis.riemannHypothesis" /tmp/deepmind-rh-target-axioms.log
          if grep -Fq "sorryAx" /tmp/deepmind-rh-target-axioms.log; then
            echo "DEEPMIND_RH_TARGET_SOURCE=OPEN_WITH_SORRYAX"
          else
            echo "DEEPMIND_RH_TARGET_SOURCE=NO_SORRYAX"
          fi

      - name: Emit target disposition
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            "TARGET_PATH=FormalConjectures/Millennium/RiemannHypothesis.lean" \
            "TARGET_THEOREM=RiemannHypothesis.riemannHypothesis" \
            "TARGET_TYPE=RiemannHypothesis" \
            "AEGIS_TARGET_MATCH=V13 final_sign_implies_rh_v13 / universal_zero_quadratic_implies_rh_v13" \
            "AUTHORITY_EFFECT=NONE"
