name: AEGIS RH DeepMind Target Direct V1

on:
  push:
    branches:
      - 'proof/rh-deepmind-target-direct-replay-v2'
    paths:
      - 'AegisRH/PR606/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
      - '.github/workflows/aegis-rh-deepmind-target-direct-v1.yml'
  pull_request:
    paths:
      - 'AegisRH/PR606/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
      - '.github/workflows/aegis-rh-deepmind-target-direct-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_BASE_SHA: cfe368ce2ffa0d196a4319c02b956997edf9f3fa
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  UPSTREAM_RH_BLOB: 5b1dcd5c46ab4a5f449d7d4a5c5ddce7c89c3542

jobs:
  direct-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact fork head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_BASE_SHA }}
          path: .aegis-base
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact environment pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          test "$(git -C .aegis-base rev-parse HEAD)" = "$AEGIS_BASE_SHA"
          test -f FormalConjectures/Millennium/RiemannHypothesis.lean
          grep -F 'public import RHRestrictedWeilCriterionV13' FormalConjectures/Millennium/RiemannHypothesis.lean
          ! grep -n -A3 'theorem riemannHypothesis : RiemannHypothesis' FormalConjectures/Millennium/RiemannHypothesis.lean | grep -F 'sorry'

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version

      - name: Compute V13 terminal dependency closure
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          LOCAL="$GITHUB_WORKSPACE/AegisRH/PR606"
          SRC="$LOCAL/Source"
          COMPAT="$LOCAL/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/deepmind-rh-target"
          mkdir -p "$OUT"

          python3 - "$BASE" "$LOCAL" "$SRC" "$COMPAT" "$GITHUB_WORKSPACE/.deepmind-rh-order.txt" <<'PY'
          import pathlib, sys
          base=pathlib.Path(sys.argv[1])
          local=pathlib.Path(sys.argv[2])
          src=pathlib.Path(sys.argv[3])
          compat=pathlib.Path(sys.argv[4])
          out=pathlib.Path(sys.argv[5])

          groups = [
              ("BASE", {p.stem:p for p in base.glob("*.lean")}),
              ("SRC", {p.stem:p for p in src.glob("*.lean")}),
              ("COMPAT", {p.stem:p for p in compat.glob("*.lean")}),
              ("LOCAL", {p.stem:p for p in local.glob("*.lean")}),
          ]
          mods=set()
          for _,g in groups: mods |= set(g)

          def selected(m):
              for _,g in reversed(groups):
                  if m in g: return g[m]
              raise SystemExit("missing:"+m)

          deps={}
          for m in mods:
              ds=[]
              for line in selected(m).read_text(encoding="utf-8").splitlines():
                  s=line.split("--",1)[0].strip()
                  if not s.startswith("import "): continue
                  for tok in s[7:].split():
                      root=tok.split(".")[0]
                      if root in mods: ds.append(root)
              deps[m]=ds

          target="RHRestrictedWeilCriterionV13"
          assert target in mods
          seen=set(); temp=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in temp: raise SystemExit("cycle:"+m)
              temp.add(m)
              for d in deps[m]: visit(d)
              temp.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n")
          print("DEEPMIND_RH_TERMINAL_CLOSURE_COUNT", len(order))
          for m in order:
              print(m, selected(m))
          PY

      - name: Compile V13 terminal closure
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          LOCAL="$GITHUB_WORKSPACE/AegisRH/PR606"
          SRC="$LOCAL/Source"
          COMPAT="$LOCAL/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/deepmind-rh-target"
          ROOT_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$LOCAL:$COMPAT:$SRC:$BASE:$ROOT_LEAN_PATH"

          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            FILE="$BASE/$MOD.lean"
            [ -f "$SRC/$MOD.lean" ] && FILE="$SRC/$MOD.lean"
            [ -f "$COMPAT/$MOD.lean" ] && FILE="$COMPAT/$MOD.lean"
            [ -f "$LOCAL/$MOD.lean" ] && FILE="$LOCAL/$MOD.lean"
            echo "=== $MOD ==="
            lean -o "$OUT/$MOD.olean" "$FILE"
          done < "$GITHUB_WORKSPACE/.deepmind-rh-order.txt"

      - name: Compile current DeepMind RH target
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          LOCAL="$GITHUB_WORKSPACE/AegisRH/PR606"
          SRC="$LOCAL/Source"
          COMPAT="$LOCAL/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/deepmind-rh-target"
          ROOT_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$LOCAL:$COMPAT:$SRC:$BASE:$ROOT_LEAN_PATH"

          TARGET="FormalConjectures/Millennium/RiemannHypothesis.lean"
          lean "$TARGET" 2>&1 | tee /tmp/deepmind-rh-target.log

          cat >/tmp/DeepMindRHTargetAudit.lean <<'LEAN'
          import FormalConjectures.Millennium.RiemannHypothesis
          #print axioms RiemannHypothesis.riemannHypothesis
          LEAN
          lean /tmp/DeepMindRHTargetAudit.lean 2>&1 | tee /tmp/deepmind-rh-target-axioms.log
          ! grep -F 'sorryAx' /tmp/deepmind-rh-target-axioms.log
