name: RH Snowflake log2-log3 globalization v1

on:
  pull_request:
    paths:
      - 'FormalConjectures/Millennium/RHSnowflakeLog23.lean'
      - 'AEGISOverlay/RHPrimeThreeWindowV1.lean'
      - 'AEGISOverlay/RHKreinCriticalLineBridgeV1.lean'
      - '.github/workflows/rh-snowflake-log23-globalization-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5

jobs:
  log23-density:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Compile snowflake density theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean FormalConjectures/Millennium/RHSnowflakeLog23.lean 2>&1 | tee snowflake-log23.log
          ! grep -F 'sorryAx' snowflake-log23.log
          ! grep -F 'error:' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.irrational_log_two_div_log_three' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.snowflake_shift_group_dense' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.snowflake_nonnegative_of_continuous' snowflake-log23.log

      - name: Upload proof replay log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-snowflake-log23-${{ github.sha }}-${{ github.run_id }}
          path: snowflake-log23.log
          if-no-files-found: warn
          retention-days: 30

  prime3-window:
    needs: log23-density
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Checkout exact AEGIS #679 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Compile exact AEGIS dyadic-window dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          python3 - "$ROOT" evidence/prime3-aegis-modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          target="RHDyadicWindowV13"
          mods={p.stem:p for p in root.glob("*.lean")}
          if target not in mods:
              raise SystemExit(f"missing target: {target}")
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "):
                      continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods:
                          ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n")
          print("PRIME3_AEGIS_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence/prime3-$m.log"
          done < evidence/prime3-aegis-modules.txt

      - name: Compile prime-3 translation theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AEGISOverlay/RHPrimeThreeWindowV1.lean 2>&1 | tee evidence/prime3-overlay.log
          ! grep -F 'sorryAx' evidence/prime3-overlay.log
          ! grep -F 'error:' evidence/prime3-overlay.log
          grep -F 'AEGIS.RHPrimeThreeWindowV1.nat_eq_pow_three_of_log_window' evidence/prime3-overlay.log
          grep -F 'AEGIS.RHPrimeThreeWindowV1.gap_prime_sum_exact_three' evidence/prime3-overlay.log
          grep -F 'AEGIS.RHPrimeThreeWindowV1.gap_B_norm_bound_three' evidence/prime3-overlay.log

      - name: Upload prime-3 replay logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-prime3-window-${{ github.sha }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30


  krein-critical-line:
    needs: log23-density
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Checkout exact AEGIS #679 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Compile exact AEGIS Krein dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence-krein .lake/build/lib/lean
          python3 - "$ROOT" evidence-krein/modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          targets=["WeilAutocorrelationMellinV11","RHKreinPairingV13"]
          mods={p.stem:p for p in root.glob("*.lean")}
          for target in targets:
              if target not in mods:
                  raise SystemExit(f"missing target: {target}")
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "):
                      continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods:
                          ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          for target in targets: visit(target)
          out.write_text("\n".join(order)+"\n")
          print("KREIN_AEGIS_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-krein/$m.log"
          done < evidence-krein/modules.txt

      - name: Compile critical-line Mellin Fourier bridge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AEGISOverlay/RHKreinCriticalLineBridgeV1.lean 2>&1 | tee evidence-krein/overlay.log
          ! grep -F 'sorryAx' evidence-krein/overlay.log
          ! grep -F 'error:' evidence-krein/overlay.log
          grep -F 'AEGIS.RHKreinCriticalLineBridgeV1.critical_mellin_eq_fourier_scaled_v1' evidence-krein/overlay.log
          grep -F 'AEGIS.RHKreinCriticalLineBridgeV1.autocorrelation_mellin_critical_normSq_v1' evidence-krein/overlay.log

      - name: Upload Krein bridge replay logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-krein-critical-${{ github.sha }}-${{ github.run_id }}
          path: evidence-krein/
          if-no-files-found: warn
          retention-days: 30
