name: RH Snowflake log2-log3 globalization v1

on:
  pull_request:
    paths:
      - 'FormalConjectures/Millennium/RHSnowflakeLog23.lean'
      - '.github/workflows/rh-snowflake-log23-globalization-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  log23-density:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Compile snowflake density theorem
        shell: bash
        run: |
          set -euo pipefail
          lake env lean FormalConjectures/Millennium/RHSnowflakeLog23.lean 2>&1 | tee snowflake-log23.log
          ! grep -F 'sorryAx' snowflake-log23.log
          ! grep -F 'error:' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.irrational_log_two_div_log_three' snowflake-log23.log
          grep -F 'RHSnowflakeLog23.snowflake_shift_group_dense' snowflake-log23.log

      - name: Upload proof replay log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-snowflake-log23-${{ github.sha }}-${{ github.run_id }}
          path: snowflake-log23.log
          if-no-files-found: warn
          retention-days: 30