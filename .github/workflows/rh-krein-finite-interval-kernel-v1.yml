name: RH Krein finite interval kernel v1

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHKreinFiniteIntervalKernelV1.lean'
      - '.github/workflows/rh-krein-finite-interval-kernel-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  finite-interval-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Compile finite interval soundness kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/AEGISOverlay evidence-finite
          lake env lean -o .lake/build/lib/lean/AEGISOverlay/RHKreinFiniteIntervalKernelV1.olean             AEGISOverlay/RHKreinFiniteIntervalKernelV1.lean 2>&1 | tee evidence-finite/kernel.log
          ! grep -F 'sorryAx' evidence-finite/kernel.log
          ! grep -F 'error:' evidence-finite/kernel.log
          grep -F 'AEGIS.RHKreinFiniteIntervalKernelV1.expIPartial_error' evidence-finite/kernel.log
          grep -F 'AEGIS.RHKreinFiniteIntervalKernelV1.sin_expIPartial_error' evidence-finite/kernel.log
          grep -F 'AEGIS.RHKreinFiniteIntervalKernelV1.cos_expIPartial_error' evidence-finite/kernel.log

      - name: Record exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence-finite/formal-conjectures-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-finite/mathlib-sha.txt
          lean --version > evidence-finite/lean-version.txt

      - name: Upload finite interval kernel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-krein-finite-interval-kernel-${{ github.sha }}-${{ github.run_id }}
          path: evidence-finite/
          if-no-files-found: warn
          retention-days: 30
