# Read-only production verification; no deploy, credentials, mathematics or authority changes.
name: AEGIS production MCP anonymous verification
on:
  push:
    branches: ['ci/aegis-alexa-source-replay-v1']
    paths: ['.github/workflows/aegis-alexa-source-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-alexa-source-witness
  cancel-in-progress: false
env:
  AEGIS_SOURCE_SHA: '4bcd50774e3d1236099839bd9b69ec9086915fff'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SOURCE_SHA }}
          persist-credentials: false
      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "$AEGIS_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Release unit and routing tests
        run: |
          mkdir -p production-evidence
          node --test hub/test/mcp-evidence.test.mjs hub/test/mcp-routing.test.mjs > production-evidence/unit.log 2>&1
          cat production-evidence/unit.log
      - name: Anonymous HTTPS and actual production browser interaction
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {createHash} from 'node:crypto'
          import {spawn,spawnSync} from 'node:child_process'
          import {readFileSync,writeFileSync,mkdirSync,mkdtempSync,readdirSync,existsSync,rmSync} from 'node:fs'
          import {join} from 'node:path'
          import {tmpdir} from 'node:os'
          import {verifyArchive} from './hub/public/labs/mcp/verify.mjs'
          const origin='https://aegisomega.com', out='production-evidence', source=process.env.AEGIS_SOURCE_SHA
          const sha=b=>createHash('sha256').update(b).digest('hex')
          const report={schema_version:'1.0.0',source_commit:source,production_deployment:'dpl_5GjkEPPzxFzq7BmY1BP82rZXtUYY',
            observed_at:new Date().toISOString(),anonymous:true,auth_bypass:false,requests:[],assets:[],browser:[],verdict:'FAIL'}
          const save=()=>writeFileSync(join(out,'production-verification.json'),JSON.stringify(report,null,2)+'\n')
          const delay=ms=>new Promise(r=>setTimeout(r,ms))
          async function until(fn,reason,ms=30000){const end=Date.now()+ms;while(Date.now()<end){if(await fn())return;await delay(100)}throw new Error('Timeout: '+reason)}
          async function get(path){
            const res=await fetch(origin+path,{redirect:'error',credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(20000)})
            const bytes=Buffer.from(await res.arrayBuffer())
            report.requests.push({path,status:res.status,bytes:bytes.length,sha256:sha(bytes),
              headers:Object.fromEntries(['content-type','content-security-policy','cache-control','x-content-type-options','referrer-policy','etag'].map(k=>[k,res.headers.get(k)]))})
            assert.equal(res.status,200,path);assert.ok(bytes.length<5000000,'Response too large');return {res,bytes}
          }
          let processHandle,socket,profile
          try{
            for(const path of ['/labs/mcp','/labs/mcp/']){
              const {res,bytes}=await get(path)
              assert.ok(bytes.equals(readFileSync('hub/public/labs/mcp/index.html')),'Entry HTML differs from exact source')
              assert.match(res.headers.get('content-security-policy')??'',/frame-ancestors 'none'/)
              assert.equal(res.headers.get('cache-control'),'no-store')
              assert.equal(res.headers.get('x-content-type-options'),'nosniff')
              assert.equal(res.headers.get('referrer-policy'),'no-referrer')
            }
            const downloaded={}
            for(const file of readdirSync('hub/public/labs/mcp').sort()){
              const {bytes}=await get('/labs/mcp/'+file), expected=readFileSync('hub/public/labs/mcp/'+file)
              assert.ok(bytes.equals(expected),'Published file mismatch: '+file)
              report.assets.push({file,bytes:bytes.length,sha256:sha(bytes),exact_source_match:true});downloaded[file]=bytes
            }
            const verified=await verifyArchive(downloaded['receipt.json'],downloaded['trace.json'])
            assert.equal(verified.status,'RECORDED_EVIDENCE_VERIFIED')
            report.archive_verdict=verified.status
            const home=await get('/'), html=home.bytes.toString('utf8')
            assert.match(html,/src="\/assets\/index-DGLTI8s8.js"/)
            assert.match(html,/href="\/assets\/index-CTCIHabW.css"/)
            assert.match(html,/The AI system that governs itself/)
            assert.equal(home.res.headers.get('etag'),'W/"5b71cb0f86725d0837ab04cd032d65ce"')
            report.homepage={baseline_html_etag_matched:true,javascript:'/assets/index-DGLTI8s8.js',css:'/assets/index-CTCIHabW.css'}
            writeFileSync(join(out,'homepage.html'),home.bytes)
            for(const asset of [report.homepage.javascript,report.homepage.css])await get(asset)
            const chrome=spawnSync('which',['google-chrome'],{encoding:'utf8'}).stdout.trim()
            assert.ok(chrome,'Real Chrome required')
            profile=mkdtempSync(join(tmpdir(),'aegis-production-public-'))
            processHandle=spawn(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage',
              '--no-first-run','--no-default-browser-check','--disable-background-networking','--disable-component-update',
              '--disable-sync','--remote-debugging-address=127.0.0.1','--remote-debugging-port=0','--user-data-dir='+profile,'about:blank'],{stdio:'ignore'})
            await until(()=>existsSync(join(profile,'DevToolsActivePort')),'Chrome startup',45000)
            const port=readFileSync(join(profile,'DevToolsActivePort'),'utf8').split('\n')[0]
            const pages=await(await fetch('http://127.0.0.1:'+port+'/json/list')).json()
            socket=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl)
            await new Promise((resolve,reject)=>{socket.addEventListener('open',resolve,{once:true});socket.addEventListener('error',reject,{once:true})})
            let next=0;const pending=new Map(),errors=[],network=[]
            socket.addEventListener('message',event=>{
              const msg=JSON.parse(event.data)
              if(msg.method==='Runtime.exceptionThrown')errors.push(msg.params.exceptionDetails.text)
              if(msg.method==='Network.requestWillBeSent'){
                const r=msg.params.request
                assert.ok(!Object.keys(r.headers).some(k=>/authorization|x-vercel-protection-bypass/i.test(k)),'Unexpected browser credential')
                network.push({method:r.method,url:r.url})
              }
              const p=pending.get(msg.id);if(p){pending.delete(msg.id);msg.error?p.reject(new Error(JSON.stringify(msg.error))):p.resolve(msg.result)}
            })
            function cmd(method,params={}){const id=++next;return new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>{pending.delete(id);reject(new Error('CDP timeout '+method))},20000)
              pending.set(id,{resolve:r=>{clearTimeout(timer);resolve(r)},reject:e=>{clearTimeout(timer);reject(e)}});socket.send(JSON.stringify({id,method,params}))})}
            async function evaluate(expression){const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});assert.ok(!r.exceptionDetails,JSON.stringify(r.exceptionDetails));return r.result.value}
            async function click(selector){
              const p=await evaluate(`(()=>{const e=document.querySelector(${JSON.stringify(selector)});e.scrollIntoView({block:'center'});const r=e.getBoundingClientRect();return {x:r.x+r.width/2,y:r.y+r.height/2}})()`)
              await cmd('Input.dispatchMouseEvent',{type:'mousePressed',button:'left',clickCount:1,...p})
              await cmd('Input.dispatchMouseEvent',{type:'mouseReleased',button:'left',clickCount:1,...p})
            }
            await cmd('Page.enable');await cmd('Runtime.enable');await cmd('Network.enable')
            for(const viewport of [{name:'desktop',width:1360,height:1040},{name:'mobile',width:390,height:844}]){
              await cmd('Emulation.setDeviceMetricsOverride',{width:viewport.width,height:viewport.height,deviceScaleFactor:1,mobile:viewport.name==='mobile'})
              const url=origin+'/labs/mcp/?verification='+viewport.name
              const nav=await cmd('Page.navigate',{url});assert.equal(nav.errorText,undefined)
              await until(()=>evaluate(`location.href===${JSON.stringify(url)}&&document.readyState==='complete'&&!!document.getElementById('verify')`),'public page load')
              assert.equal(await evaluate("document.getElementById('result').dataset.verdict"),'NOT_VERIFIED')
              await click('#verify')
              await until(()=>evaluate("['VERIFIED','FAILED'].includes(document.getElementById('result').dataset.verdict)"),'public evidence verification')
              assert.equal(await evaluate("document.getElementById('result').dataset.verdict"),'VERIFIED',await evaluate("document.getElementById('result').innerText"))
              await click('[data-step="3"]');assert.match(await evaluate("document.getElementById('exchange').textContent"),/policy_json/)
              await click('[data-step="4"]');assert.match(await evaluate("document.getElementById('exchange').textContent"),/IDENTITY_UNAVAILABLE/)
              await click('#tamper');await until(()=>evaluate("document.getElementById('tamper-status').textContent.startsWith('REJECTED')"),'tamper rejection')
              assert.equal(await evaluate('document.documentElement.scrollWidth>window.innerWidth'),false)
              await evaluate('window.scrollTo(0,0)')
              const size=(await cmd('Page.getLayoutMetrics')).cssContentSize
              const shot=await cmd('Page.captureScreenshot',{format:'png',captureBeyondViewport:true,clip:{x:0,y:0,width:viewport.width,height:Math.ceil(size.height),scale:1}})
              writeFileSync(join(out,viewport.name+'.png'),Buffer.from(shot.data,'base64'))
              report.browser.push({viewport,anonymous_page_loaded:true,recorded_evidence_verified:true,policy_inspected:true,denial_inspected:true,tamper_rejected:true,horizontal_overflow:false})
            }
            assert.deepEqual(errors,[])
            assert.ok(network.every(r=>r.method==='GET'&&new URL(r.url).origin===origin),'Unexpected browser network operation')
            report.browser_network=network;report.browser_errors=errors;report.mcp_calls=0;report.model_calls=0
            report.verdict='PASS';report.completed_at=new Date().toISOString();save()
            console.log('PRODUCTION_PASS: anonymous HTTPS, all seven byte-exact assets, unchanged homepage fingerprint, actual desktop/mobile verification and tamper rejection')
          }catch(error){report.error=String(error?.stack??error);save();console.error(report.error);process.exitCode=1}
          finally{socket?.close();processHandle?.kill('SIGTERM');if(profile){await delay(250);rmSync(profile,{recursive:true,force:true,maxRetries:5,retryDelay:100})}}
          JS
      - name: Preserve production observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-mcp-production-${{ env.AEGIS_SOURCE_SHA }}
          path: production-evidence/
          if-no-files-found: error
          retention-days: 30
