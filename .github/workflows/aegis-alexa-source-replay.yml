# Existing isolated source witness; no mathematical source, main branch, deployment or authority changes.
name: AEGIS static MCP evidence witness
on:
  push:
    branches: ['ci/aegis-alexa-source-replay-v1']
    paths: ['.github/workflows/aegis-alexa-source-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-alexa-source-witness
  cancel-in-progress: false
env:
  AEGIS_SOURCE_SHA: 'ac65cc27dba8943de1bc33b6240d202bfd8fd142'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify the AEGIS source, not this witness repository
        run: test "$(git rev-parse HEAD)" = "$AEGIS_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Replay static evidence page with real desktop/mobile Chromium
        working-directory: hub
        run: node test/verify-mcp-public.mjs
      - name: Preserve source-bound observation, not an admission grant
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-mcp-public-${{ env.AEGIS_SOURCE_SHA }}
          path: hub/evidence/mcp-public/
          if-no-files-found: error
          retention-days: 30
