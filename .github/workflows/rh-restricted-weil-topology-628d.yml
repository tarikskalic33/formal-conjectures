name: AEGIS RH Restricted Weil Topology 628d Replay

on:
  push:
    branches:
      - 'evidence/rh-restricted-weil-topology-628d-v1'
    paths:
      - '.github/workflows/rh-restricted-weil-topology-628d.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-restricted-weil-topology-628d.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: a6826e3d8e81261a5b35e374bc2860770efd9555
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: exact restricted-Weil topology replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact FormalConjectures environment
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          mkdir -p evidence

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Checkout exact AEGIS topology source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Compile exact topology module
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          cp .aegis/sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionTopologyV13.lean .
          mkdir -p .lake/build/lib/lean
          sha256sum RestrictedWeilCriterionTopologyV13.lean | tee evidence/source-sha256.log
          lake env lean -o ".lake/build/lib/lean/RestrictedWeilCriterionTopologyV13.olean" \
            RestrictedWeilCriterionTopologyV13.lean 2>&1 | tee evidence/compile.log

      - name: Audit axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > TopologyAudit.lean <<'LEAN'
          import RestrictedWeilCriterionTopologyV13
          #print axioms AEGIS.RestrictedWeilCriterionTopologyV13.riemann_zeta_zeros_countable_v13
          #print axioms AEGIS.RestrictedWeilCriterionTopologyV13.centered_riemann_zero_set_countable_v13
          #print axioms AEGIS.RestrictedWeilCriterionTopologyV13.rightHalfParam_injective_v13
          #print axioms AEGIS.RestrictedWeilCriterionTopologyV13.right_half_minus_centered_zeros_pathConnected_v13
          #print axioms AEGIS.RestrictedWeilCriterionTopologyV13.right_half_minus_centered_zeros_preconnected_v13
          LEAN
          lake env lean TopologyAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit disposition
        if: always()
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          PRODUCER=RestrictedWeilCriterionTopologyV13
          RIGHT_HALF_MINUS_CENTERED_ZEROS_PRECONNECTED=TARGETED
          RH=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-restricted-weil-topology-628d
          path: evidence/
          if-no-files-found: error
          retention-days: 30
