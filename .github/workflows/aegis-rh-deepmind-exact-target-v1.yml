name: AEGIS DeepMind Exact RH Target V1

on:
  push:
    branches:
      - 'proof/rh-deepmind-target-direct-replay-v1'
    paths:
      - 'AegisRH/PR606/**'
      - '.github/workflows/aegis-rh-deepmind-exact-target-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_BASE_SHA: cfe368ce2ffa0d196a4319c02b956997edf9f3fa
  AEGIS_HEAD_SHA: 589adf0480bd4d7c12c9828027ea6228398377f4
  DEEPMIND_SHA: 0771383387505c96d1b2f6a3d35088ad00892c5c
  DEEPMIND_RH_BLOB: 5b1dcd5c46ab4a5f449d7d4a5c5ddce7c89c3542
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_PROVIDER_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  LI_FACTORIZATION_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  exact-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fork proof port
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact AEGIS base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_BASE_SHA }}
          path: .aegis-base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Li provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact DeepMind Formal Conjectures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google-deepmind/formal-conjectures
          ref: ${{ env.DEEPMIND_SHA }}
          path: .deepmind
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis-base rev-parse HEAD)" = "$AEGIS_BASE_SHA"
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          test "$(git -C .li hash-object Hadamard/General/Factorization.lean)" = "$LI_FACTORIZATION_BLOB"
          test "$(git -C .deepmind rev-parse HEAD)" = "$DEEPMIND_SHA"
          test "$(git -C .deepmind hash-object FormalConjectures/Millennium/RiemannHypothesis.lean)" = "$DEEPMIND_RH_BLOB"
          python3 - <<'PY'
          import json, os
          m=json.load(open('AegisRH/PR606/PORT_MANIFEST.json'))
          assert m['source_head_sha'] == os.environ['AEGIS_HEAD_SHA']
          assert m['source_base_sha'] == os.environ['AEGIS_BASE_SHA']
          PY
          grep -F "$MATHLIB_SHA" lake-manifest.json
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lean --version

      - name: Restore exact Li provider build
        id: li-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Rebind and build exact Li provider
        if: steps.li-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .li
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path

          p=Path('lakefile.lean')
          text=p.read_text(encoding='utf-8')
          old=os.environ['LI_PROVIDER_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert text.count(old) == 1
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          q=Path('Hadamard/General/Factorization.lean')
          text=q.read_text(encoding='utf-8')
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
            if old in text:
              text=text.replace(old,new,1)
          q.write_text(text,encoding='utf-8')
          PY
          rm -f lake-manifest.json
          lake update mathlib
          python3 - <<'PY'
          import json, os
          m=json.load(open('lake-manifest.json'))
          p=next(x for x in m['packages'] if x['name']=='mathlib')
          assert (p.get('rev') or p.get('inputRev')) == os.environ['MATHLIB_SHA']
          PY
          lake exe cache get
          lake build \
            Hadamard.OrderOne.LogDerivMultiplicity \
            Lc.LiCriterion.XiGrowth \
            Lc.LiCriterion.HadamardSummabilityBridge \
            Lc.LiCriterion.HadamardBridge

      - name: Save exact Li provider build
        if: steps.li-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Compute restricted terminal dependency closure
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          SRC="$GITHUB_WORKSPACE/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/AegisRH/PR606/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-deepmind-rh"
          mkdir -p "$OUT"

          python3 - "$BASE" "$SRC" "$COMPAT" "$GITHUB_WORKSPACE/AegisRH/PR606/V13Scratch.lean" "$GITHUB_WORKSPACE/.deepmind-rh-order.txt" <<'PY'
          import pathlib, sys
          base=pathlib.Path(sys.argv[1])
          src=pathlib.Path(sys.argv[2])
          compat=pathlib.Path(sys.argv[3])
          terminal=pathlib.Path(sys.argv[4])
          out=pathlib.Path(sys.argv[5])

          base_mods={p.stem:p for p in base.glob('*.lean')}
          src_mods={p.stem:p for p in src.glob('*.lean')}
          compat_mods={p.stem:p for p in compat.glob('*.lean')}
          mods=set(base_mods)|set(src_mods)|set(compat_mods)

          def selected(m):
            if m in compat_mods: return compat_mods[m]
            if m in src_mods: return src_mods[m]
            if m in base_mods: return base_mods[m]
            raise SystemExit('missing:'+m)

          deps={}
          for m in mods:
            ds=[]
            for line in selected(m).read_text(encoding='utf-8').splitlines():
              s=line.split('--',1)[0].strip()
              if not s.startswith('import '): continue
              for tok in s[7:].split():
                root=tok.split('.')[0]
                if root in mods: ds.append(root)
            deps[m]=ds

          roots=[]
          for line in terminal.read_text(encoding='utf-8').splitlines():
            s=line.split('--',1)[0].strip()
            if not s.startswith('import '): continue
            for tok in s[7:].split():
              root=tok.split('.')[0]
              if root in mods: roots.append(root)

          seen=set(); temp=set(); order=[]
          def visit(m):
            if m in seen: return
            if m in temp: raise SystemExit('cycle:'+m)
            temp.add(m)
            for d in deps[m]: visit(d)
            temp.remove(m)
            seen.add(m)
            order.append(m)

          for m in roots: visit(m)
          out.write_text('\n'.join(order)+'\n')
          print('DEEPMIND_RH_DEPENDENCY_COUNT', len(order))
          print('\n'.join(order))
          PY

      - name: Compile restricted terminal closure
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          SRC="$GITHUB_WORKSPACE/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/AegisRH/PR606/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-deepmind-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$COMPAT:$SRC:$BASE:$BASE_LEAN_PATH"

          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            FILE="$BASE/$MOD.lean"
            KIND="BASE"
            if [ -f "$SRC/$MOD.lean" ]; then FILE="$SRC/$MOD.lean"; KIND="SOURCE"; fi
            if [ -f "$COMPAT/$MOD.lean" ]; then FILE="$COMPAT/$MOD.lean"; KIND="COMPAT"; fi
            echo "=== $KIND $MOD ==="
            lean -o "$OUT/$MOD.olean" "$FILE"
          done < "$GITHUB_WORKSPACE/.deepmind-rh-order.txt"

          export LEAN_PATH="$GITHUB_WORKSPACE/AegisRH/PR606:$OUT:$COMPAT:$SRC:$BASE:$BASE_LEAN_PATH"
          lean -o "$OUT/V13Scratch.olean" AegisRH/PR606/V13Scratch.lean
          lean -o "$OUT/RHRestrictedWeilCriterionV13.olean" AegisRH/PR606/RHRestrictedWeilCriterionV13.lean

          cat >/tmp/RestrictedTerminalAudit.lean <<'LEAN'
          import RHRestrictedWeilCriterionV13
          #print axioms AEGIS.RHRestrictedWeilCriterionV13.restricted_weil_criterion_v13
          #print axioms AEGIS.RHRestrictedWeilCriterionV13.universal_zero_quadratic_implies_mathlib_rh_v13
          LEAN
          lean /tmp/RestrictedTerminalAudit.lean 2>&1 | tee /tmp/restricted-terminal-axioms.log
          ! grep -F 'sorryAx' /tmp/restricted-terminal-axioms.log

      - name: Compile exact current DeepMind RH source with AEGIS proof body
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/.aegis-base/sovereign-omega-v2/formal/bridges/lean"
          SRC="$GITHUB_WORKSPACE/AegisRH/PR606/Source"
          COMPAT="$GITHUB_WORKSPACE/AegisRH/PR606/Compat"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-deepmind-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          TARGET="$GITHUB_WORKSPACE/.deepmind/FormalConjectures/Millennium/RiemannHypothesis.lean"
          PATCHED="$GITHUB_WORKSPACE/.deepmind-rh-target.lean"

          python3 - "$TARGET" "$PATCHED" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          assert src.count('public import FormalConjecturesUtil') == 1
          src=src.replace(
              'public import FormalConjecturesUtil',
              'public import FormalConjecturesUtil\nimport RHRestrictedWeilCriterionV13',
              1,
          )
          old='''@[category research open, AMS 11]
          theorem riemannHypothesis : RiemannHypothesis := by
            sorry'''
          new='''@[category research open, AMS 11]
          theorem riemannHypothesis : RiemannHypothesis := by
            exact AEGIS.RHRestrictedWeilCriterionV13.restricted_weil_criterion_v13'''
          assert src.count(old) == 1, src.count(old)
          src=src.replace(old,new,1)
          Path(sys.argv[2]).write_text(src,encoding='utf-8')
          PY

          mkdir -p "$OUT/FormalConjectures/Millennium"
          export LEAN_PATH="$GITHUB_WORKSPACE/AegisRH/PR606:$OUT:$COMPAT:$SRC:$BASE:$BASE_LEAN_PATH"
          lean -o "$OUT/FormalConjectures/Millennium/RiemannHypothesis.olean" "$PATCHED"             2>&1 | tee /tmp/deepmind-exact-rh.log

          cat >/tmp/DeepMindExactRHAudit.lean <<'LEAN'
          import FormalConjectures.Millennium.RiemannHypothesis
          #print axioms RiemannHypothesis.riemannHypothesis
          LEAN
          lean /tmp/DeepMindExactRHAudit.lean 2>&1 | tee /tmp/deepmind-exact-rh-axioms.log
          ! grep -F 'sorryAx' /tmp/deepmind-exact-rh-axioms.log

      - name: Emit exact-target receipt
        if: always()
        shell: bash
        run: |
          printf '%s\n'             "DEEPMIND_SHA=$DEEPMIND_SHA"             "DEEPMIND_RH_BLOB=$DEEPMIND_RH_BLOB"             "AEGIS_HEAD_SHA=$AEGIS_HEAD_SHA"             "MATHLIB_SHA=$MATHLIB_SHA"             "LEAN_TOOLCHAIN=$LEAN_TOOLCHAIN"             "LI_PROVIDER_SHA=$LI_PROVIDER_SHA"             "TARGET=FormalConjectures/Millennium/RiemannHypothesis.lean"             "AUTHORITY_EFFECT=NONE"
