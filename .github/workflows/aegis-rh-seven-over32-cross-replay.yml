name: AEGIS RH Recovered 7-over-32 Cross-Repo Exact Replay

on:
  push:
    branches:
      - 'proof/rh-small-window-producer-fork-v1'
    paths:
      - '.github/workflows/aegis-rh-seven-over32-cross-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_SOURCE_SHA: f8313af917e41a5a56f441447a46cf8ffe97d247
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: verify 7/32 source-identity and Lean kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout fork exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          path: .mathlib
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout source-exact AEGIS commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SOURCE_SHA }}
          path: .aegis
          persist-credentials: false
          fetch-depth: 1
      - name: Bind repository, toolchain, and recovered proof bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SOURCE_SHA"
          test "$(cat .mathlib/lean-toolchain)" = "$LEAN_TOOLCHAIN"
          mkdir -p evidence .build
          printf 'FORK_HEAD=%s\nAEGIS_SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n' "$GITHUB_SHA" "$AEGIS_SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" | tee evidence/provenance.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('.aegis/sovereign-omega-v2/formal/bridges/lean')
          refs={
            'RHHalfCapV13':'802bd2f1112d4a0b727417738eb77422d2dd579a',
            'RHThreeCellV13':'a17c5b8a76d0618ed1736729ab63243e6486cece',
            'RHHalfCapGainV13':'7c5fd4671941d61cf3be9945a22a00a0f52d10d8',
            'RHThresholdGainV13':'32e1e1dae8bd7da8f2af1e3afdbcd526460e75b1',
            'RHBonusGainV13':'566640692bab3175998271f4b94b8c3dbab992d0',
            'RHThreeCellGainV13':'03263c914df499a62cb8b7b08b53c93957694265',
            'RHThresholdClassV13':'ce80ca2afdb85d2047c82a293e0cc586524a0603',
            'RHThreeCellClassV13':'babdf3a671ea7a2cfcbacc693059ed38f11cb396',
            'RHWindowSevenOver32V1':'83c8682c8c98cd43a7caf8b63cd859c48e05748e'
          }
          for n,expected in refs.items():
            p=root/(n+'.lean')
            assert p.is_file(), ('SOURCE_MISSING',n)
            c=p.read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(c)).encode()+b'\0'+c).hexdigest()
            assert actual==expected, ('BLOB_NOT_EXACT',n,actual)
          files={p.stem:p for p in root.glob('*.lean')}
          deps={}
          for n,p in files.items():
            deps[n]=[v.split('.')[-1] for s in p.read_text().splitlines() if re.match(r'^\s*import\s+',s) for v in s.split()[1:] if v.split('.')[-1] in files]
          active=set();done=set();order=[]
          def visit(n):
            if n in done:return
            assert n not in active, ('CYCLE',n)
            assert n in files, ('MISSING',n)
            active.add(n)
            for sub in deps[n]:visit(sub)
            active.remove(n);done.add(n);order.append(n)
          visit('RHWindowSevenOver32V1')
          Path('evidence/ordered-modules.txt').write_text('\n'.join(order)+'\n')
          Path('evidence/verified-blobs.txt').write_text('\n'.join(n+' '+sha for n,sha in refs.items())+'\n')
          print('BLOB_EXACT=PASS; dependency_modules='+str(len(order)))
          PY
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd .mathlib
          lake exe cache get
          lean --version | tee ../evidence/lean-version.txt
      - name: Compile transitive dependency closure and the original 7/32 producer
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.build"
          BASE_LEAN_PATH="$(cd "$GITHUB_WORKSPACE/.mathlib" && lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$ROOT:$BASE_LEAN_PATH"
          while IFS= read -r module; do
            echo "=== COMPILE $module ==="
            lean -o "$OUT/$module.olean" "$ROOT/$module.lean" 2>&1 | tee "evidence/$module.log"
          done < evidence/ordered-modules.txt
      - name: Kernel axiom audit for both 7/32 results
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          BASE_LEAN_PATH="$(cd "$GITHUB_WORKSPACE/.mathlib" && lake env printenv LEAN_PATH)"
          export LEAN_PATH="$GITHUB_WORKSPACE/.build:$ROOT:$BASE_LEAN_PATH"
          cat >/tmp/AEGISSevenOver32Audit.lean <<'LEAN'
          import RHWindowSevenOver32V1
          #check AEGIS.RHWindowSevenOver32V1.window_seven_over_32_arithmetic_nonpositive_v1
          #print axioms AEGIS.RHWindowSevenOver32V1.window_seven_over_32_arithmetic_nonpositive_v1
          #print axioms AEGIS.RHWindowSevenOver32V1.window_le_seven_over_32_arithmetic_nonpositive_v1
          LEAN
          lean /tmp/AEGISSevenOver32Audit.lean 2>&1 | tee evidence/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          s=Path('evidence/axioms.log').read_text()
          assert 'sorryAx' not in s and 'error:' not in s
          chunks=s.split('depends on axioms:')
          assert len(chunks)==3, 'MISSING_PRINT_AXIOMS'
          for c in chunks[1:]:
            found=set(x.strip() for x in c.split(']',1)[0].lstrip('[').split(','))
            assert found == {'propext','Classical.choice','Quot.sound'},found
          Path('evidence/RESULT.txt').write_text('WINDOW_7_32=KERNEL_PASS\nAXIOMS=STANDARD_ONLY\nRH=NOT_CLAIMED\n')
          print('EXACT_HEAD_RH_SEVEN_OVER_32=PASS')
          PY
      - name: Fail-closed mathematical boundary
        if: always()
        shell: bash
        run: |
          printf 'FORK_HEAD=%s\nAEGIS_SOURCE_SHA=%s\nWINDOW=7/32\nUNIVERSAL_FINAL_SIGN=OPEN\nRIEMANN_HYPOTHESIS=NOT_PROMOTED\nAUTHORITY_EFFECT=NONE\n' "$GITHUB_SHA" "$AEGIS_SOURCE_SHA" > evidence/BOUNDARY.txt
      - name: Upload proof provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegis-seven-over32-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
