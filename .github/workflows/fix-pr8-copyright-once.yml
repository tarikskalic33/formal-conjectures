name: Fix PR8 Copyright Once

on:
  push:
    branches:
      - 'proof/rh-pr606-port-v1'
    paths:
      - '.github/workflows/fix-pr8-copyright-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: proof/rh-pr606-port-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Prepend required headers and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = """\/-
Copyright 2026 The Formal Conjectures Authors.

Licensed under the Apache License, Version 2.0 (the "License");
you may not use this file except in compliance with the License.
You may obtain a copy of the License at

    https://www.apache.org/licenses/LICENSE-2.0

Unless required by applicable law or agreed to in writing, software
distributed under the License is distributed on an "AS IS" BASIS,
WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
See the License for the specific language governing permissions and
limitations under the License.
-/

""".replace("\\/-", "/-")

          changed = 0
          for p in sorted(Path("AegisRH/PR606").rglob("*.lean")):
              s = p.read_text(encoding="utf-8")
              if s.startswith("/-\nCopyright 2026 The Formal Conjectures Authors."):
                  continue
              p.write_text(header + s, encoding="utf-8")
              changed += 1
          print(f"HEADERED={changed}")
          PY
          git rm .github/workflows/fix-pr8-copyright-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AegisRH/PR606
          git diff --cached --check
          git commit -m "fix(ci): add Formal Conjectures headers to PR606 port"
          git push origin HEAD:proof/rh-pr606-port-v1
