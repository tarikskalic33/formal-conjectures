name: AEGIS RH Fork Replay V1

on:
  push:
    branches:
      - 'proof/riemann-hypothesis-aegis-v1'
    paths:
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
      - 'AegisRH/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
  pull_request:
    paths:
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
      - 'AegisRH/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_SHA: 1bdc7abc06d44f39f1379503caabf7e66a708956
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_PROVIDER_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  LI_FACTORIZATION_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fork exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout AEGIS exact theorem DAG
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Li-criterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          test "$(git -C .li hash-object Hadamard/General/Factorization.lean)" = "$LI_FACTORIZATION_BLOB"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          grep -F 'leanprover/lean4:v4.33.1' lean-toolchain

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Apply exact-head standalone Lean compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          REAL=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesRealV1.lean"
          HALF=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesHalfPlaneV1.lean"
          python3 - "$REAL" "$HALF" <<'PY'
          from pathlib import Path
          import sys

          # --- Real-axis module: source-preserving compatibility only. ---
          p=Path(sys.argv[1])
          s=p.read_text()
          original=s

          anchor="import Mathlib.MeasureTheory.Integral.Bochner.Basic\n"
          if anchor not in s:
              s=s.replace(
                  "import Mathlib.Analysis.SpecialFunctions.Log.Deriv\n",
                  "import Mathlib.Analysis.SpecialFunctions.Log.Deriv\n"+anchor,
                  1,
              )

          s=s.replace(
              "exact norm_integral_le_integral_norm _",
              "exact MeasureTheory.norm_integral_le_integral_norm _",
              1,
          )
          s=s.replace(
              "(deriv (Real.log ∘ Real.Gamma) x : ℂ)",
              "((deriv (Real.log ∘ Real.Gamma) x : ℝ) : ℂ)",
              1,
          )
          s=s.replace(
              "(deriv Real.Gamma x : ℂ)",
              "((deriv Real.Gamma x : ℝ) : ℂ)",
              1,
          )

          old="have hmnonpos : -(m : ℝ) ≤ 0 := by positivity"
          new="have hmnonpos : -(m : ℝ) ≤ 0 := neg_nonpos.mpr (Nat.cast_nonneg m)"
          count=s.count(old)
          assert count == 6, count
          s=s.replace(old,new)

          assert s.count("← deriv_log,") == 1
          s=s.replace("← deriv_log,","← Real.deriv_log y,",1)
          s=s.replace("differentiableAt_log hy.ne'","Real.differentiableAt_log hy.ne'")
          s=s.replace("Real.deriv.log hGreal hGne","deriv.log hGreal hGne")

          assert s.count("\n  push_cast\n") == 1
          s=s.replace("\n  push_cast\n","\n  push_cast\n  rfl\n",1)
          assert s.count("          push_cast\n") == 1
          s=s.replace("          push_cast\n","          push_cast\n          rfl\n",1)

          assert s != original
          p.write_text(s)

          # --- Half-plane module: exact 4.33.1 / 0df API elaboration repair. ---
          p=Path(sys.argv[2])
          s=p.read_text()
          original=s

          old="""theorem isOpen_rightHalfPlane_v1 : IsOpen RightHalfPlaneV1 := by
            simpa [RightHalfPlaneV1] using
              (Complex.continuous_re.isOpen_preimage (Ioi (0 : ℝ)) isOpen_Ioi)
          """
          new="""theorem isOpen_rightHalfPlane_v1 : IsOpen RightHalfPlaneV1 := by
            rw [show RightHalfPlaneV1 = Complex.re ⁻¹' Ioi (0 : ℝ) by
              ext z
              simp [RightHalfPlaneV1]]
            exact Complex.continuous_re.isOpen_preimage (Ioi (0 : ℝ)) isOpen_Ioi
          """
          assert old in s
          s=s.replace(old,new,1)

          # Three identical Nat-cast nonzero proofs; preserve source indentation.
          src=s.splitlines()
          dst=[]
          i=0
          n=0
          while i < len(src):
              if (
                  src[i].strip() == "have hn1 : ((n : ℂ) + 1) ≠ 0 := by"
                  and i + 3 < len(src)
                  and src[i+1].strip() == "intro h"
                  and src[i+2].strip() == "have hre := congrArg Complex.re h"
                  and src[i+3].strip() == "simp at hre"
              ):
                  indent=src[i][:len(src[i])-len(src[i].lstrip())]
                  dst.append(indent+"have hn1 : ((n : ℂ) + 1) ≠ 0 := by")
                  dst.append(indent+"  norm_cast")
                  i += 4
                  n += 1
                  continue
              dst.append(src[i])
              i += 1
          assert n == 3, n
          s="\n".join(dst) + ("\n" if original.endswith("\n") else "")

          old_factor=(
              "  field_simp [seriesTerm, hn1, hzn]\n"
              "  <;> ring"
          )
          new_factor=(
              "  unfold seriesTerm\n"
              "  field_simp [hn1, hzn] <;> ring"
          )
          assert s.count(old_factor) == 1, ("factor", s.count(old_factor))
          s=s.replace(old_factor,new_factor,1)

          old_mem="simpa [U] using Metric.mem_ball_self hδpos"
          assert s.count(old_mem) == 1, ("mem_ball", s.count(old_mem))
          s=s.replace(
              old_mem,
              "simpa [U] using (Metric.mem_ball_self (x := z0) hδpos)",
              1,
          )

          old_add="simpa [Complex.add_re] using h"
          assert s.count(old_add) == 1, ("add_re", s.count(old_add))
          s=s.replace(old_add,"simpa [Complex.add_re, add_comm] using h",1)

          old_field=(
              "            field_simp [hδpos.ne', hn1pos.ne']\n"
              "            ring"
          )
          new_field="            field_simp [hδpos.ne', hn1pos.ne'] <;> ring"
          assert s.count(old_field) == 1, ("field", s.count(old_field))
          s=s.replace(old_field,new_field,1)

          old_mtest=(
              "  have hdiff :\n"
              "      DifferentiableOn ℂ\n"
              "        (fun z : ℂ => ∑' n : ℕ, seriesTerm z n) U :=\n"
              "    differentiableOn_tsum_of_summable_norm\n"
              "      hmajorant hterm hUopen hbound"
          )
          new_mtest=(
              "  have hdiff :\n"
              "      DifferentiableOn ℂ\n"
              "        (fun z : ℂ => ∑' n : ℕ, seriesTerm z n) U := by\n"
              "    have hc :=\n"
              "      (tendstoUniformlyOn_tsum hmajorant hbound).tendstoLocallyUniformlyOn\n"
              "    refine hc.differentiableOn (Eventually.of_forall fun s => ?_) hUopen\n"
              "    exact DifferentiableOn.fun_sum fun i _ => hterm i"
          )
          assert s.count(old_mtest) == 1, ("mtest", s.count(old_mtest))
          s=s.replace(old_mtest,new_mtest,1)

          old_dig=(
              "  have hDigammaAnal :\n"
              "      AnalyticOnNhd ℂ Complex.digamma RightHalfPlaneV1 := by\n"
              "    simpa [Complex.digamma_def, logDeriv_apply] using\n"
              "      hGammaAnal.deriv.div hGammaAnal\n"
              "        (fun z hz => Complex.Gamma_ne_zero_of_re_pos hz)"
          )
          new_dig=(
              "  have hDigammaAnal :\n"
              "      AnalyticOnNhd ℂ Complex.digamma RightHalfPlaneV1 := by\n"
              "    rw [show Complex.digamma =\n"
              "        (fun z : ℂ => deriv Complex.Gamma z / Complex.Gamma z) by\n"
              "      funext z\n"
              "      simp [Complex.digamma_def, logDeriv_apply]]\n"
              "    exact hGammaAnal.deriv.div hGammaAnal\n"
              "      (fun z hz => Complex.Gamma_ne_zero_of_re_pos hz)"
          )
          assert s.count(old_dig) == 1, ("digamma", s.count(old_dig))
          s=s.replace(old_dig,new_dig,1)

          old_tend=(
              "    have hzero :\n"
              "        Tendsto (fun n : ℕ => 1 / ((n + 1 : ℕ) : ℂ))\n"
              "          atTop (𝓝 0) :=\n"
              "      tendsto_one_div_add_atTop_nhds_zero_nat (𝕜 := ℂ)"
          )
          new_tend=(
              "    have hzero :\n"
              "        Tendsto (fun n : ℕ => 1 / ((n + 1 : ℕ) : ℂ))\n"
              "          atTop (𝓝 0) := by\n"
              "      simpa [Nat.cast_add, Nat.cast_one] using\n"
              "        (tendsto_one_div_add_atTop_nhds_zero_nat (𝕜 := ℂ))"
          )
          assert s.count(old_tend) == 1, ("tendsto", s.count(old_tend))
          s=s.replace(old_tend,new_tend,1)

          old_last="    · simp [s])"
          new_last=(
              "    · have hn' : ((n : ℂ) + 1) ≠ 0 := by norm_cast\n"
              "      simp [s, hn'])"
          )
          assert s.count(old_last) == 1, ("last_simp", s.count(old_last))
          s=s.replace(old_last,new_last,1)

          assert s != original
          p.write_text(s)
          PY

          grep -F 'MeasureTheory.norm_integral_le_integral_norm' "$REAL"
          grep -F 'rw [show RightHalfPlaneV1 = Complex.re ⁻¹' "$HALF"
          grep -F 'tendstoUniformlyOn_tsum hmajorant hbound' "$HALF"
          grep -F 'rw [show Complex.digamma =' "$HALF"
          cp AegisRH/Overlay/WeilFixedLineGammaFubiniV10.lean \
            .aegis/sovereign-omega-v2/formal/bridges/lean/WeilFixedLineGammaFubiniV10.lean
          cp AegisRH/Overlay/WeilFixedLineGammaAssemblyV10.lean \
            .aegis/sovereign-omega-v2/formal/bridges/lean/WeilFixedLineGammaAssemblyV10.lean

      - name: Apply Archimedean correction Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          ARCH=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilArchimedeanCorrectionV10.lean"
          python3 - "$ARCH" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          robust_tendsto = """  have h := (Real.tendsto_log_comp_add_sub_log 1).neg
            convert h using 1 <;> simp [sub_eq_add_neg]"""

          old_tendsto_v1 = """  have h := (Real.tendsto_log_comp_add_sub_log 1).neg
            simpa only [neg_sub, neg_zero] using h"""
          if old_tendsto_v1 in s:
              s = s.replace(old_tendsto_v1, robust_tendsto, 1)

          old_tendsto_v2 = """  simpa only [neg_sub] using
              (Real.tendsto_log_comp_add_sub_log 1).neg"""
          if old_tendsto_v2 in s:
              s = s.replace(old_tendsto_v2, robust_tendsto, 1)

          old_hpoint_v1 = """    have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := by linarith
              have hx1 : x + 1 ≠ 0 := by linarith"""
          new_hpoint = """    have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])
              have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])"""
          if old_hpoint_v1 in s:
              s = s.replace(old_hpoint_v1, new_hpoint, 1)

          old_hpoint_v2 = """    intro x hx
              have hx0 : x ≠ 0 := by linarith
              have hx1 : x + 1 ≠ 0 := by linarith"""
          new_hpoint_v2 = """    intro x hx
              have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])
              have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])"""
          if old_hpoint_v2 in s:
              s = s.replace(old_hpoint_v2, new_hpoint_v2, 1)

          final_log = "    _ = Real.log 2 := by rw [Real.log_one, show (1 : ℝ) + 1 = 2 by norm_num]; ring"
          s = s.replace("    _ = Real.log 2 := by norm_num", final_log, 1)
          s = s.replace("    _ = Real.log 2 := by simp", final_log, 1)

          assert "convert h using 1 <;> simp [sub_eq_add_neg]" in s
          assert "have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])" in s
          assert "have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])" in s
          assert "rw [Real.log_one, show (1 : ℝ) + 1 = 2 by norm_num]; ring" in s

          p.write_text(s, encoding="utf-8")
          print("ARCH_COMPAT_CHANGED", s != original)
          PY

      - name: Apply finite-dilation Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          DIL=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteDilationFilterV10.lean"
          python3 - "$DIL" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          old = """    simpa [finiteDilationFilterV10, a, b, d2, d4, addPacket]
                using htotal.2"""
          new = """    simpa [finiteDilationFilterV10, a, b, d2, d4, addPacket, hab.2]
                using htotal.2"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """    dsimp [z]
              rw [Complex.norm_cpow_eq_rpow_re_of_pos (by norm_num : (0 : ℝ) < 2)]
              simp"""
          new = """    dsimp [z]
              simpa using
                (Complex.norm_cpow_eq_rpow_re_of_pos
                  (x := (2 : ℝ))
                  (by norm_num : (0 : ℝ) < 2)
                  (-s))"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """  rw [finiteDilationMultiplierV10]
            norm_num [Complex.cpow_neg_one]"""
          new = """  rw [finiteDilationMultiplierV10]
            norm_num [Complex.cpow_neg_one] <;> ring"""
          if old in s:
              s = s.replace(old, new, 1)

          assert "addPacket, hab.2]" in s
          assert "(x := (2 : ℝ))" in s
          assert "norm_num [Complex.cpow_neg_one] <;> ring" in s
          p.write_text(s, encoding="utf-8")
          print("FINITE_DILATION_COMPAT_CHANGED", s != original)
          PY

      - name: Fetch exact Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          test "$(python3 - <<'PY'
          import json
          m=json.load(open('lake-manifest.json'))
          print(next(x['rev'] for x in m['packages'] if x['name']=='mathlib'))
          PY
          )" = "$MATHLIB_SHA"
          lean --version

      - name: Preflight standalone digamma closure
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-digamma"
          mkdir -p "$OUT"
          python3 - "$SRC" "$GITHUB_WORKSPACE/.digamma-order.txt" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          target='WeilDigammaSeriesHalfPlaneV1'
          mods={p.stem:p for p in src.glob('*.lean')}
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text().splitlines():
                  s=line.strip()
                  if not s.startswith('import '): continue
                  for tok in s[7:].split():
                      root=tok.split('.')[0]
                      if root in mods: ds.append(root)
              deps[m]=ds
          seen=set(); temp=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in temp: raise SystemExit('cycle:'+m)
              temp.add(m)
              for d in deps[m]: visit(d)
              temp.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text('\n'.join(order)+'\n')
          print('DIGAMMA_PREFLIGHT_COUNT',len(order))
          PY
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$SRC:$BASE_LEAN_PATH"
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            echo "=== PREFLIGHT $MOD ==="
            lean -o "$OUT/$MOD.olean" "$SRC/$MOD.lean"
          done < "$GITHUB_WORKSPACE/.digamma-order.txt"

      - name: Restore exact Li provider build
        id: li-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Rebind and build exact Li provider
        shell: bash
        run: |
          set -euo pipefail
          cd .li
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old = os.environ['LI_PROVIDER_ORIGINAL_MATHLIB_SHA']
          new = os.environ['MATHLIB_SHA']
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))

          q = Path('Hadamard/General/Factorization.lean')
          text = q.read_text()
          assert text.count('ite_eq_right') == 2, text.count('ite_eq_right')
          assert text.count('ite_eq_left') == 1, text.count('ite_eq_left')
          q.write_text(text.replace('ite_eq_right', 'if_neg').replace('ite_eq_left', 'if_pos'))
          PY
          rm -f lake-manifest.json
          lake update mathlib
          python3 - <<'PY'
          import json, os
          m=json.load(open('lake-manifest.json'))
          p=next(x for x in m['packages'] if x['name']=='mathlib')
          assert p['rev'] == os.environ['MATHLIB_SHA'], p['rev']
          PY
          lake exe cache get
          lake build Lc.LiCriterion.XiOrderBridge

      - name: Save exact Li provider build
        if: steps.li-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Restore exact AEGIS closure build
        id: aegis-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/aegis-rh
          key: aegis-rh-closure-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Compile exact AEGIS RH closure
        if: steps.aegis-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          mkdir -p "$OUT"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          python3 - "$SRC" "$GITHUB_WORKSPACE/.aegis-order.txt" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          targets=[
            'WeilRHImpliesFinalSignV11',
            'RHZeroKernelLaplaceAnalyticV12',
            'RestrictedWeilCriterionResidueCoefficientV11',
            'RestrictedWeilCriterionPoleIsolationV10',
            'MeromorphicIdentityPreconnectedV11',
          ]
          mods={p.stem:p for p in src.glob('*.lean')}
          deps={}
          for m,p in mods.items():
            ds=[]
            for line in p.read_text(encoding='utf-8').splitlines():
              s=line.strip()
              if not s.startswith('import '): continue
              for tok in s[7:].split():
                root=tok.split('.')[0]
                if root in mods: ds.append(root)
            deps[m]=ds
          seen=set(); temp=set(); order=[]
          def visit(m):
            if m in seen: return
            if m in temp: raise SystemExit('cycle:'+m)
            if m not in mods: raise SystemExit('missing:'+m)
            temp.add(m)
            for d in deps[m]: visit(d)
            temp.remove(m); seen.add(m); order.append(m)
          for t in targets: visit(t)
          out.write_text('\n'.join(order)+'\n')
          print('LOCAL_CLOSURE_COUNT',len(order))
          print('\n'.join(order))
          PY
          export LEAN_PATH="$OUT:$SRC:$BASE_LEAN_PATH"
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            echo "=== COMPILE $MOD ==="
            lean -o "$OUT/$MOD.olean" "$SRC/$MOD.lean"
          done < "$GITHUB_WORKSPACE/.aegis-order.txt"

      - name: Save exact AEGIS closure build
        if: steps.aegis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/aegis-rh
          key: aegis-rh-closure-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Audit load-bearing axioms
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$SRC:$BASE_LEAN_PATH"
          cat > /tmp/Audit.lean <<'LEAN'
          import WeilRHImpliesFinalSignV11
          import RHZeroKernelLaplaceAnalyticV12
          import RestrictedWeilCriterionResidueCoefficientV11
          import RestrictedWeilCriterionPoleIsolationV10
          import MeromorphicIdentityPreconnectedV11
          #print axioms AEGIS.WeilRHImpliesFinalSignV11.rh_implies_final_sign_residual_v11
          #print axioms AEGIS.RHZeroKernelLaplaceAnalyticV12.zero_kernel_laplace_analyticOnNhd_v12
          #print axioms AEGIS.RestrictedWeilCriterionResidueCoefficientV11.exists_nonzero_zero_coefficient_v11
          #print axioms AEGIS.RestrictedWeilCriterionPoleIsolationV10.exists_centered_zero_isolation_v10
          #print axioms AEGIS.MeromorphicIdentityPreconnectedV11.eventuallyEq_nhdsNE_of_meromorphicOn_of_seed
          LEAN
          lean /tmp/Audit.lean 2>&1 | tee /tmp/aegis-rh-axioms.log
          ! grep -q 'sorryAx' /tmp/aegis-rh-axioms.log

      - name: Compile fork-side V13 scratch if present
        shell: bash
        run: |
          set -euo pipefail
          test -f AegisRH/V13Scratch.lean || exit 0
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$GITHUB_WORKSPACE/AegisRH:$OUT:$SRC:$BASE_LEAN_PATH"
          lean -o "$OUT/V13Scratch.olean" AegisRH/V13Scratch.lean

      - name: Compile fork-side V13 if present
        shell: bash
        run: |
          set -euo pipefail
          test -f AegisRH/RestrictedWeilCriterionFinalV13.lean || exit 0
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$GITHUB_WORKSPACE/AegisRH:$OUT:$SRC:$BASE_LEAN_PATH"
          lean -o "$OUT/RestrictedWeilCriterionFinalV13.olean" AegisRH/RestrictedWeilCriterionFinalV13.lean
          cat > /tmp/FinalAudit.lean <<'LEAN'
          import RestrictedWeilCriterionFinalV13
          #print axioms AEGIS.RestrictedWeilCriterionFinalV13.final_sign_implies_rh_v13
          LEAN
          lean /tmp/FinalAudit.lean 2>&1 | tee /tmp/final-v13-axioms.log
          ! grep -q 'sorryAx' /tmp/final-v13-axioms.log
