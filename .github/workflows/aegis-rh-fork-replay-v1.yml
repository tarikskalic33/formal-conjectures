name: AEGIS RH Fork Replay V1

on:
  push:
    branches:
      - 'proof/riemann-hypothesis-aegis-v1'
    paths:
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
      - 'AegisRH/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
  pull_request:
    paths:
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
      - 'AegisRH/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_SHA: 589adf0480bd4d7c12c9828027ea6228398377f4
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_PROVIDER_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  LI_FACTORIZATION_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fork exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout AEGIS exact theorem DAG
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Li-criterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          test "$(git -C .li hash-object Hadamard/General/Factorization.lean)" = "$LI_FACTORIZATION_BLOB"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          grep -F 'leanprover/lean4:v4.33.1' lean-toolchain

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify source-bound RH compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          REAL=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesRealV1.lean"
          HALF=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesHalfPlaneV1.lean"
          LAP=".aegis/sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionLaplaceV10.lean"
          grep -F 'MeasureTheory.norm_integral_le_integral_norm' "$REAL"
          grep -F 'Nat.cast_add_one_ne_zero' "$HALF"
          grep -F 'Complex.differentiableOn_tsum_of_summable_norm' "$HALF"
          grep -F 'countable_nontrivialZeroIndex_v10' "$LAP"
          test "$(git -C .aegis status --porcelain)" = ""

      - name: Apply Archimedean correction Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          ARCH=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilArchimedeanCorrectionV10.lean"
          python3 - "$ARCH" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          robust_tendsto = """  have h := (Real.tendsto_log_comp_add_sub_log 1).neg
            convert h using 1 <;> simp [sub_eq_add_neg]"""

          old_tendsto_v1 = """  have h := (Real.tendsto_log_comp_add_sub_log 1).neg
            simpa only [neg_sub, neg_zero] using h"""
          if old_tendsto_v1 in s:
              s = s.replace(old_tendsto_v1, robust_tendsto, 1)

          old_tendsto_v2 = """  simpa only [neg_sub] using
              (Real.tendsto_log_comp_add_sub_log 1).neg"""
          if old_tendsto_v2 in s:
              s = s.replace(old_tendsto_v2, robust_tendsto, 1)

          old_hpoint_v1 = """    have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := by linarith
              have hx1 : x + 1 ≠ 0 := by linarith"""
          new_hpoint = """    have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])
              have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])"""
          if old_hpoint_v1 in s:
              s = s.replace(old_hpoint_v1, new_hpoint, 1)

          old_hpoint_v2 = """    intro x hx
              have hx0 : x ≠ 0 := by linarith
              have hx1 : x + 1 ≠ 0 := by linarith"""
          new_hpoint_v2 = """    intro x hx
              have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])
              have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])"""
          if old_hpoint_v2 in s:
              s = s.replace(old_hpoint_v2, new_hpoint_v2, 1)

          final_log = "    _ = Real.log 2 := by rw [Real.log_one, show (1 : ℝ) + 1 = 2 by norm_num]; ring"
          s = s.replace("    _ = Real.log 2 := by norm_num", final_log, 1)
          s = s.replace("    _ = Real.log 2 := by simp", final_log, 1)

          assert "convert h using 1 <;> simp [sub_eq_add_neg]" in s
          assert "have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])" in s
          assert "have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])" in s
          assert "rw [Real.log_one, show (1 : ℝ) + 1 = 2 by norm_num]; ring" in s

          p.write_text(s, encoding="utf-8")
          print("ARCH_COMPAT_CHANGED", s != original)
          PY

      - name: Apply finite-dilation Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          DIL=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteDilationFilterV10.lean"
          python3 - "$DIL" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          old = """    simpa [finiteDilationFilterV10, a, b, d2, d4, addPacket]
                using htotal.2"""
          new = """    simpa [finiteDilationFilterV10, a, b, d2, d4, addPacket, hab.2]
                using htotal.2"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """    dsimp [z]
              rw [Complex.norm_cpow_eq_rpow_re_of_pos (by norm_num : (0 : ℝ) < 2)]
              simp"""
          new = """    dsimp [z]
              simpa using
                (Complex.norm_cpow_eq_rpow_re_of_pos
                  (x := (2 : ℝ))
                  (by norm_num : (0 : ℝ) < 2)
                  (-s))"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """theorem finiteDilationMultiplier_one_v10 :
              finiteDilationMultiplierV10 1 = 0 := by
            rw [finiteDilationMultiplierV10]
            norm_num [Complex.cpow_neg_one]"""
          new = """theorem finiteDilationMultiplier_one_v10 :
              finiteDilationMultiplierV10 1 = 0 := by
            rw [finiteDilationMultiplier_factor_v10]
            apply mul_eq_zero.mpr
            right
            norm_num [Complex.cpow_neg_one]"""
          if old in s:
              s = s.replace(old, new, 1)

          assert "addPacket, hab.2]" in s
          assert "(x := (2 : ℝ))" in s
          assert "rw [finiteDilationMultiplier_factor_v10]" in s
          assert "apply mul_eq_zero.mpr" in s
          p.write_text(s, encoding="utf-8")
          print("FINITE_DILATION_COMPAT_CHANGED", s != original)
          PY

      - name: Inventory full PR606 terminal dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".aegis/sovereign-omega-v2/formal/bridges/lean")
          files = {p.stem: p for p in root.glob("*.lean")}
          assert len(files) == 131, len(files)

          targets = [
              "RHMillenniumGateV10",
              "RHZeroKernelLaplaceAnalyticV12",
              "RestrictedWeilCriterionResidueCoefficientV11",
              "RestrictedWeilCriterionPoleIsolationV10",
              "RestrictedWeilCriterionResidueWitnessV11",
              "RestrictedWeilCriterionTargetWitnessV11",
              "MeromorphicIdentityPreconnectedV11",
              "WeilRHImpliesFinalSignV11",
          ]
          for target in targets:
              assert target in files, target

          pat = re.compile(r"^\s*import\s+(.+?)\s*$")
          deps = {}
          for name, path in files.items():
              local = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  m = pat.match(line)
                  if not m:
                      continue
                  for token in m.group(1).split():
                      leaf = token.split(".")[-1]
                      if leaf in files:
                          local.append(leaf)
              deps[name] = sorted(set(local))

          temp, done, order = set(), set(), []
          def visit(name):
              if name in done:
                  return
              if name in temp:
                  raise RuntimeError(f"local import cycle at {name}")
              temp.add(name)
              for dep in deps[name]:
                  visit(dep)
              temp.remove(name)
              done.add(name)
              order.append(name)

          for target in targets:
              visit(target)

          out = Path("evidence")
          (out / "pr606-terminal-targets.txt").write_text(
              "\n".join(targets) + "\n", encoding="utf-8")
          (out / "pr606-terminal-modules.txt").write_text(
              "\n".join(order) + "\n", encoding="utf-8")
          (out / "pr606-terminal-closure-count.txt").write_text(
              str(len(order)) + "\n", encoding="utf-8")
          (out / "pr606-lean-inventory-count.txt").write_text(
              str(len(files)) + "\n", encoding="utf-8")
          (out / "pr606-modules-outside-terminal-closure.txt").write_text(
              "\n".join(sorted(set(files) - set(order))) + "\n", encoding="utf-8")

          print("PR606_LEAN_INVENTORY_COUNT", len(files))
          print("PR606_TERMINAL_DEPENDENCY_CLOSURE_COUNT", len(order))
          print("PR606_TERMINAL_TARGETS", ",".join(targets))
          print("PR606_TERMINAL_MODULES_BEGIN")
          print("\n".join(order))
          print("PR606_TERMINAL_MODULES_END")
          PY
          {
            echo "## PR #606 exact-head Lean inventory"
            echo
            echo "- proof source: `$AEGIS_SHA`"
            echo "- total local Lean modules: `$(cat evidence/pr606-lean-inventory-count.txt)`"
            echo "- terminal dependency closure: `$(cat evidence/pr606-terminal-closure-count.txt)`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore shared Mathlib olean cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache/mathlib
          key: oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            oleans-${{ hashFiles('lean-toolchain') }}-

      - name: Fetch exact Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache unpack || true
          if ! test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/Analysis/MellinTransform.olean; then
            lake exe cache get
          fi
          test "$(python3 - <<'PY'
          import json
          m=json.load(open('lake-manifest.json'))
          print(next(x['rev'] for x in m['packages'] if x['name']=='mathlib'))
          PY
          )" = "$MATHLIB_SHA"
          lean --version

      - name: Restore exact Li provider build
        id: li-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Rebind and build exact Li provider
        if: steps.li-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .li
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lakefile.lean')
          text = p.read_text()
          old = os.environ['LI_PROVIDER_ORIGINAL_MATHLIB_SHA']
          new = os.environ['MATHLIB_SHA']
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, new))

          q = Path('Hadamard/General/Factorization.lean')
          text = q.read_text()
          assert text.count('ite_eq_right') == 2, text.count('ite_eq_right')
          assert text.count('ite_eq_left') == 1, text.count('ite_eq_left')
          q.write_text(text.replace('ite_eq_right', 'if_neg').replace('ite_eq_left', 'if_pos'))
          PY
          rm -f lake-manifest.json
          lake update mathlib
          python3 - <<'PY'
          import json, os
          m=json.load(open('lake-manifest.json'))
          p=next(x for x in m['packages'] if x['name']=='mathlib')
          assert p['rev'] == os.environ['MATHLIB_SHA'], p['rev']
          PY
          lake exe cache get
          lake build Lc.LiCriterion.XiOrderBridge

      - name: Save exact Li provider build
        if: steps.li-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .li/.lake/build
          key: li-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}

      - name: Restore incremental PR606 full DAG cache
        id: pr606-full-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/pr606-full-131
          key: pr606-full-131-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            pr606-full-131-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-

      - name: Compile full PR606 131-module Lean DAG
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OVERLAY="$GITHUB_WORKSPACE/AegisRH/Overlay"
          OUT="$GITHUB_WORKSPACE/.lake/pr606-full-131"
          EVID="$GITHUB_WORKSPACE/evidence/pr606-full-131"
          mkdir -p "$OUT" "$EVID"

          python3 - "$SRC" "$EVID/order.txt" <<'PY'
          from pathlib import Path
          import re, sys

          root=Path(sys.argv[1])
          out=Path(sys.argv[2])
          files={p.stem:p for p in root.glob("*.lean")}
          assert len(files)==131, len(files)

          pat=re.compile(r"^\s*import\s+(.+?)\s*$")
          deps={}
          for name,path in files.items():
              local=[]
              for line in path.read_text(encoding="utf-8").splitlines():
                  m=pat.match(line)
                  if not m:
                      continue
                  for token in m.group(1).split():
                      leaf=token.split(".")[-1]
                      if leaf in files:
                          local.append(leaf)
              deps[name]=sorted(set(local))

          temp,done,order=set(),set(),[]
          def visit(name):
              if name in done:
                  return
              if name in temp:
                  raise RuntimeError("cycle:"+name)
              temp.add(name)
              for dep in deps[name]:
                  visit(dep)
              temp.remove(name)
              done.add(name)
              order.append(name)

          for name in sorted(files):
              visit(name)
          assert len(order)==131, len(order)
          out.write_text("\n".join(order)+"\n",encoding="utf-8")
          print("PR606_FULL_DAG_COUNT",len(order))
          PY

          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$SRC:$BASE_LEAN_PATH"

          : > "$EVID/status.tsv"
          passed=0
          dirty=0
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            FILE="$SRC/$MOD.lean"
            KIND="SOURCE"
            if [ -f "$OVERLAY/$MOD.lean" ]; then
              FILE="$OVERLAY/$MOD.lean"
              KIND="OVERLAY"
            fi
            FILE_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
            STAMP="$OUT/$MOD.source.sha256"
            if [ "$dirty" -eq 0 ] && [ -f "$OUT/$MOD.olean" ] && [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$FILE_SHA" ]; then
              echo "=== PR606 FULL 131: $MOD ($KIND, CACHED) ==="
              printf '%s\tCACHED\t%s\n' "$MOD" "$KIND" >> "$EVID/status.tsv"
              passed=$((passed+1))
              continue
            fi
            dirty=1
            echo "=== PR606 FULL 131: $MOD ($KIND) ==="
            if lean -o "$OUT/$MOD.olean" "$FILE" >"$EVID/$MOD.log" 2>&1; then
              printf '%s\n' "$FILE_SHA" > "$STAMP"
              printf '%s\tPASS\t%s\n' "$MOD" "$KIND" >> "$EVID/status.tsv"
              passed=$((passed+1))
            else
              rm -f "$OUT/$MOD.olean" "$STAMP"
              printf '%s\tFAIL\t%s\n' "$MOD" "$KIND" >> "$EVID/status.tsv"
              cat "$EVID/$MOD.log"
              printf 'FIRST_FAIL_MODULE=%s\nFIRST_FAIL_KIND=%s\nPASSED_BEFORE_FAIL=%s\n'                 "$MOD" "$KIND" "$passed" > "$EVID/FIRST_FAILURE.txt"
              echo "PR606_FULL_131_FIRST_FAIL=$MOD"
              echo "PR606_FULL_131_PASSED_BEFORE_FAIL=$passed"
              exit 1
            fi
          done < "$EVID/order.txt"

          printf 'FULL_131_REPLAY=PASS\nMODULE_COUNT=131\n' > "$EVID/DISPOSITION.txt"
          echo "PR606_FULL_131_REPLAY=PASS"
          echo "PR606_FULL_131_MODULE_COUNT=$passed"

      - name: Upload full PR606 replay receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr606-full-131-${{ env.AEGIS_SHA }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/pr606-full-131/
          if-no-files-found: warn
          retention-days: 30

      - name: Save incremental PR606 full DAG cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/pr606-full-131
          key: pr606-full-131-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore fork overlay dependency closure
        id: overlay-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/aegis-overlay
          key: aegis-overlay-deps-v8-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-${{ hashFiles('AegisRH/Overlay/*.lean') }}

      - name: Compile fork-local AEGIS overlays
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OVERLAY="$GITHUB_WORKSPACE/AegisRH/Overlay"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-overlay"
          mkdir -p "$OUT"
          python3 - "$SRC" "$OVERLAY" "$GITHUB_WORKSPACE/.overlay-order.txt" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1])
          overlay_dir=pathlib.Path(sys.argv[2])
          out=pathlib.Path(sys.argv[3])
          targets=[
              'MeromorphicIdentityPreconnectedV11',
              'RHMillenniumGateV10',
              'RHTranslatedKernelDominanceV1',
              'RHZeroKernelBoundV11',
              'RHZeroKernelLaplaceAnalyticV12',
              'RHZeroKernelLaplaceV12',
              'RestrictedWeilCriterionKernelBridgeV10',
              'RestrictedWeilCriterionLaplaceV10',
              'RestrictedWeilCriterionPoleIsolationV10',
              'RestrictedWeilCriterionResidueCoefficientV11',
              'RestrictedWeilCriterionResidueWitnessV11',
              'RestrictedWeilCriterionTargetWitnessV11',
              'RestrictedWeilCriterionZeroKernelV10',
              'WeilActualZeroSummandWitnessV10',
              'WeilArchimedeanCorrectionV10',
              'WeilAutocorrelationExplicitFormulaV10',
              'WeilAutocorrelationMellinFactorV10',
              'WeilAutocorrelationMellinV11',
              'WeilDigammaSeriesHalfPlaneV1',
              'WeilDigammaSeriesRealV1',
              'WeilExplicitFormulaV10',
              'WeilFinalSignTranslationBoundV10',
              'WeilFiniteDilationFilterV10',
              'WeilFiniteDilationFilterV11',
              'WeilFixedLineArithmeticV10',
              'WeilFixedLineCompletedGammaV10',
              'WeilFixedLineGammaAssemblyV10',
              'WeilFixedLineGammaCoreV10',
              'WeilFixedLineGammaFubiniV10',
              'WeilFixedLineGammaXSpaceV10',
              'WeilFixedLineZeroSideV10',
              'WeilLogAutocorrelationV10',
              'WeilLogLiftCompactSupportV10',
              'WeilMixedMellinFactorV10',
              'WeilMomentZeroDetectionV10',
              'WeilOffLineSeedV10',
              'WeilPairedHadamardTsumFusionV1',
              'WeilPairedZeroEvaluationV9',
              'WeilRHImpliesFinalSignV11',
              'WeilStrictStripSeedV11',
              'WeilTranslatedKernelBoundV11',
              'WeilTranslatedZeroSeriesV10',
              'WeilTranslationGapInvariantV10',
              'WeilXiLogDerivDecompositionV10',
              'WeilZeroCarrierBridgeV10',
              'WeilZeroCarrierRebindV10',
              'WeilZeroKernelHermitianV11',
              'WeilZeroSideIdentificationV1',
              'WeilZeroTranslationV11',
              'WeilZeroTwoPointV11',
          ]

          source_mods={p.stem:p for p in src.glob('*.lean')}
          overlay_mods={p.stem:p for p in overlay_dir.glob('*.lean')}
          mods=set(source_mods) | set(overlay_mods)

          def selected_path(m):
              if m in overlay_mods:
                  return overlay_mods[m]
              if m in source_mods:
                  return source_mods[m]
              raise SystemExit('missing:'+m)

          deps={}
          for m in mods:
              p=selected_path(m)
              ds=[]
              for line in p.read_text(encoding='utf-8').splitlines():
                  line=line.split('--',1)[0].strip()
                  if not line.startswith('import '):
                      continue
                  for tok in line[7:].split():
                      root=tok.split('.')[0]
                      if root in mods:
                          ds.append(root)
              deps[m]=ds

          seen=set()
          temp=set()
          order=[]
          def visit(m):
              if m in seen:
                  return
              if m in temp:
                  raise SystemExit('cycle:'+m)
              if m not in mods:
                  raise SystemExit('missing:'+m)
              temp.add(m)
              for d in deps[m]:
                  visit(d)
              temp.remove(m)
              seen.add(m)
              order.append(m)

          for target in targets:
              visit(target)
          out.write_text('\n'.join(order)+'\n')
          print('FULL_RH_CLOSURE_COUNT',len(order))
          print('FULL_RH_TARGETS',','.join(targets))
          print('\n'.join(
              ('OVERLAY ' if m in overlay_mods else 'SOURCE  ')+m
              for m in order
          ))
          PY
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$SRC:$BASE_LEAN_PATH"
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            if [ -f "$OUT/$MOD.olean" ]; then
              echo "=== CACHED $MOD ==="
              continue
            fi
            FILE="$SRC/$MOD.lean"
            KIND="SOURCE DEP"
            if [ -f "$OVERLAY/$MOD.lean" ]; then
              FILE="$OVERLAY/$MOD.lean"
              KIND="FORK OVERLAY"
            fi
            echo "=== $KIND $MOD ==="
            lean -o "$OUT/$MOD.olean" "$FILE"
          done < "$GITHUB_WORKSPACE/.overlay-order.txt"
          ! grep -R -n -E '\bsorry\b|\badmit\b' "$OVERLAY"

      - name: Save fork overlay dependency closure
        if: always() && steps.overlay-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/aegis-overlay
          key: aegis-overlay-deps-v8-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-${{ hashFiles('AegisRH/Overlay/*.lean') }}

      - name: Restore exact AEGIS closure build
        id: aegis-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/aegis-rh
          key: aegis-rh-closure-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-${{ hashFiles('AegisRH/Overlay/*.lean') }}

      - name: Compile exact AEGIS RH closure
        if: steps.aegis-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          mkdir -p "$OUT"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          python3 - "$SRC" "$GITHUB_WORKSPACE/.aegis-order.txt" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          targets=[
            'RHZeroKernelLaplaceAnalyticV12',
            'RestrictedWeilCriterionResidueCoefficientV11',
            'RestrictedWeilCriterionPoleIsolationV10',
            'MeromorphicIdentityPreconnectedV11',
          ]
          mods={p.stem:p for p in src.glob('*.lean')}
          deps={}
          for m,p in mods.items():
            ds=[]
            for line in p.read_text(encoding='utf-8').splitlines():
              s=line.strip()
              if not s.startswith('import '): continue
              for tok in s[7:].split():
                root=tok.split('.')[0]
                if root in mods: ds.append(root)
            deps[m]=ds
          seen=set(); temp=set(); order=[]
          def visit(m):
            if m in seen: return
            if m in temp: raise SystemExit('cycle:'+m)
            if m not in mods: raise SystemExit('missing:'+m)
            temp.add(m)
            for d in deps[m]: visit(d)
            temp.remove(m); seen.add(m); order.append(m)
          for t in targets: visit(t)
          out.write_text('\n'.join(order)+'\n')
          print('LOCAL_CLOSURE_COUNT',len(order))
          print('\n'.join(order))
          PY
          OVERLAY_OUT="$GITHUB_WORKSPACE/.lake/aegis-overlay"
          export LEAN_PATH="$OVERLAY_OUT:$OUT:$SRC:$BASE_LEAN_PATH"
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            if [ "$MOD" = "WeilZeroTranslationV11" ] || [ "$MOD" = "WeilZeroTwoPointV11" ] || [ "$MOD" = "WeilZeroKernelHermitianV11" ] || [ "$MOD" = "RHZeroKernelLaplaceV12" ]; then
              echo "=== USE FORK OVERLAY $MOD ==="
              test -f "$OVERLAY_OUT/$MOD.olean"
              continue
            fi
            echo "=== COMPILE $MOD ==="
            lean -o "$OUT/$MOD.olean" "$SRC/$MOD.lean"
          done < "$GITHUB_WORKSPACE/.aegis-order.txt"

      - name: Save exact AEGIS closure build
        if: steps.aegis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/aegis-rh
          key: aegis-rh-closure-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.AEGIS_SHA }}-${{ env.LI_PROVIDER_SHA }}-${{ env.MATHLIB_SHA }}-${{ hashFiles('AegisRH/Overlay/*.lean') }}

      - name: Audit load-bearing axioms
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$GITHUB_WORKSPACE/.lake/aegis-overlay:$OUT:$SRC:$BASE_LEAN_PATH"
          cat > /tmp/Audit.lean <<'LEAN'
          import RHZeroKernelLaplaceAnalyticV12
          import RestrictedWeilCriterionResidueCoefficientV11
          import RestrictedWeilCriterionPoleIsolationV10
          import MeromorphicIdentityPreconnectedV11
          #print axioms AEGIS.RHZeroKernelLaplaceAnalyticV12.zero_kernel_laplace_analyticOnNhd_v12
          #print axioms AEGIS.RestrictedWeilCriterionResidueCoefficientV11.exists_nonzero_zero_coefficient_v11
          #print axioms AEGIS.RestrictedWeilCriterionPoleIsolationV10.exists_centered_zero_isolation_v10
          #print axioms AEGIS.MeromorphicIdentityPreconnectedV11.eventuallyEq_nhdsNE_of_meromorphicOn_of_seed
          LEAN
          lean /tmp/Audit.lean 2>&1 | tee /tmp/aegis-rh-axioms.log
          ! grep -q 'sorryAx' /tmp/aegis-rh-axioms.log

      - name: Compile and audit fork-side V13 scratch if present
        shell: bash
        run: |
          set -euo pipefail
          test -f AegisRH/V13Scratch.lean || exit 0
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$GITHUB_WORKSPACE/AegisRH:$OUT:$SRC:$BASE_LEAN_PATH"
          lean -o "$OUT/V13Scratch.olean" AegisRH/V13Scratch.lean
          cat > /tmp/V13ScratchAudit.lean <<'LEAN'
          import V13Scratch
          #print axioms AEGIS.V13Scratch.final_sign_implies_rh_v13
          #print axioms AEGIS.V13Scratch.universal_zero_quadratic_implies_rh_v13
          #print axioms AEGIS.V13Scratch.restricted_weil_criterion_kernel_bridge_v13
          LEAN
          lean /tmp/V13ScratchAudit.lean 2>&1 | tee /tmp/v13-scratch-axioms.log
          ! grep -q 'sorryAx' /tmp/v13-scratch-axioms.log
          if grep -n -E '\bsorry\b|\badmit\b' AegisRH/V13Scratch.lean; then
            echo "V13 scratch contains forbidden placeholder proof" >&2
            exit 1
          fi
          cat > /tmp/V13Audit.lean <<'LEAN'
          import V13Scratch
          #check AEGIS.V13Scratch.final_sign_implies_rh_v13
          #check AEGIS.V13Scratch.all_nontrivial_zeros_critical_of_final_sign_v13
          #check AEGIS.V13Scratch.universal_zero_quadratic_implies_rh_v13
          #check AEGIS.V13Scratch.restricted_weil_criterion_kernel_bridge_v13
          #print axioms AEGIS.V13Scratch.final_sign_implies_rh_v13
          #print axioms AEGIS.V13Scratch.all_nontrivial_zeros_critical_of_final_sign_v13
          #print axioms AEGIS.V13Scratch.universal_zero_quadratic_implies_rh_v13
          #print axioms AEGIS.V13Scratch.restricted_weil_criterion_kernel_bridge_v13
          LEAN
          lean /tmp/V13Audit.lean 2>&1 | tee /tmp/v13-scratch-axioms.log
          ! grep -q 'sorryAx' /tmp/v13-scratch-axioms.log

      - name: Compile fork-side V13 if present
        shell: bash
        run: |
          set -euo pipefail
          test -f AegisRH/RestrictedWeilCriterionFinalV13.lean || exit 0
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-rh"
          BASE_LEAN_PATH="$GITHUB_WORKSPACE/.li/.lake/build/lib/lean:$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$GITHUB_WORKSPACE/AegisRH:$OUT:$SRC:$BASE_LEAN_PATH"
          lean -o "$OUT/RestrictedWeilCriterionFinalV13.olean" AegisRH/RestrictedWeilCriterionFinalV13.lean
          cat > /tmp/FinalAudit.lean <<'LEAN'
          import RestrictedWeilCriterionFinalV13
          #print axioms AEGIS.RestrictedWeilCriterionFinalV13.final_sign_implies_rh_v13
          LEAN
          lean /tmp/FinalAudit.lean 2>&1 | tee /tmp/final-v13-axioms.log
          ! grep -q 'sorryAx' /tmp/final-v13-axioms.log

